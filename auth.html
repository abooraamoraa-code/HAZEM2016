<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب - المتجر البرمجي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f3f4f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; box-sizing: border-box; }
        h2 { text-align: center; color: #60a5fa; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #2563eb; }
        .btn { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #60a5fa; }
        .user-info { text-align: center; display: none; }
        .user-info p { font-size: 16px; margin-bottom: 20px; color: #34d399; }
        .logout-btn { background: #ef4444; }
        .logout-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- نموذج تسجيل الدخول -->
        <div id="loginFormSection">
            <h2>🔐 تسجيل الدخول لحسابك</h2>
            <div class="form-group">
                <label>البريد الإلكتروني أو اسم المستخدم:</label>
                <input type="text" id="userEmailInput" placeholder="ادخل بريدك الإلكتروني...">
            </div>
            <button class="btn" onclick="loginUser()">دخول / حفظ الحساب 🚀</button>
            <a href="index.html" class="back-link">العودة إلى الرئيسية 🏠</a>
        </div>

        <!-- معلومات الحساب في حال كان مسجلاً مسبقاً -->
        <div id="userInfoSection" class="user-info">
            <h2>👤 حسابك الحالي</h2>
            <p id="loggedInEmailText"></p>
            <button class="btn logout-btn" onclick="logoutUser()">تسجيل الخروج 🚪</button>
            <a href="index.html" class="back-link">العودة إلى الرئيسية 🏠</a>
        </div>
    </div>

    <script>
        // التحقق مما إذا كان المستخدم مسجلاً مسبقاً عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('user_email');
            if (savedEmail) {
                document.getElementById('loginFormSection').style.display = 'none';
                document.getElementById('userInfoSection').style.display = 'block';
                document.getElementById('loggedInEmailText').innerText = "أهلاً بك: " + savedEmail;
            }
        });

        // دالة حفظ وتسجيل الدخول
        function loginUser() {
            const email = document.getElementById('userEmailInput').value.trim();
            if (!email) {
                alert("يرجى إدخال البريد الإلكتروني أو اسم المستخدم!");
                return;
            }

            localStorage.setItem('user_email', email);
            alert("تم تسجيل الدخول بنجاح! سيتم توجيهك للمتجر.");
            window.location.href = "index.html";
        }

        // دالة تسجيل الخروج
        function logoutUser() {
            localStorage.removeItem('user_email');
            alert("تم تسجيل الخروج بنجاح.");
            window.location.reload();
        }
    </script>
</body>
</html>
